# ---------------------------------------------------------------------------
# CI — Build & Test (FinDSL)
#
# Fork-sicher: läuft auf `pull_request` (KEIN pull_request_target), hat damit
# KEINEN Zugriff auf Repo-Secrets und checkt den PR-Code gefahrlos aus.
# Es wird KEIN ungeprüfter `github.event.*`-Input in `run:`-Shells interpoliert.
#
# Job-Namen sind zugleich die Status-Check-Kontexte, die im `main`-Ruleset
# als Pflicht-Checks (merge-blockierend) hinterlegt sind. Aktuelle Pflicht-
# Kontexte: `build` (Node/Vitest), `java` (JDK 21 / Gradle-Codegen-Gate,
# Issue #7). Werden Jobs hier umbenannt, MUSS der Ruleset-Kontext mit-
# gezogen werden (Settings → Rules → main).
#
# Build-Roundtrip == die im Projekt verbindliche Reihenfolge
# (CLAUDE.md / CONTRIBUTING.md): langium:generate → build → bundle → test
# (inkl. Bundle-Smoke). Reihenfolge nicht ändern.
#
# Actions sind per Commit-SHA gepinnt (Supply-Chain-Härtung, wie plugwerk).
# Neue Tag-Refs (`@v4`) werden von Renovate (`helpers:pinGitHubActionDigests`,
# `pinDigests: true`) beim nächsten Lauf auf eine SHA gepinnt.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Node 22 LTS: Die Toolchain (scripts/enhance-textmate.mjs / langium)
      # nutzt `Object.groupBy` — erst ab Node 21+ verfügbar. Node 20 schlägt
      # mit `TypeError: Object.groupBy is not a function` fehl. Nicht senken.
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Build
        run: npm run build

      - name: Build @findsl/web (Browser-Bundle + node:-Guard + .d.ts)
        run: npm run -w @findsl/web build:web

      # editor + editor-react sind tsc-only und nicht Teil von `tsc -b` (sie
      # hängen an den web-/editor-dist-Typen). Hier bauen, damit (1) ihr Build
      # in CI verifiziert wird — nicht erst im Release — und (2) Vitest den
      # Bare-Import `@findsl/editor` im editor-react-Test auflösen kann.
      # Reihenfolge: web → editor → editor-react (dist-Typen-Abhängigkeit).
      - name: Build @findsl/editor + @findsl/editor-react (tsc)
        run: |
          npm run -w @findsl/editor build:editor
          npm run -w @findsl/editor-react build:editor-react

      # Lint NACH den Builds: der typ-bewusste Web-Block (packages/web/src)
      # prüft über `tsconfig.check.json`, das `@findsl/core` über dessen
      # gebaute `out/**/*.d.ts` auflöst — vor dem Build fehlen diese Typen
      # und der no-unsafe-*-Regelsatz schlägt flächig an. ESLint ignoriert
      # `**/generated/**` und Build-Output selbst (siehe eslint.config.js).
      # Issue #208.
      - name: Lint (ESLint Flat-Config)
        run: npm run lint

      - name: Bundle
        run: npm run bundle

      - name: Test (Vitest, inkl. Bundle-Smoke)
        run: npm test

  # -------------------------------------------------------------------------
  # `java` — Codegen-Gate (Issue #7): generiert aus examples/**/*.findsl Java,
  # kompiliert gegen die Hand-Runtime, führt das generierte prüfe→JUnit als
  # Interpreter-Orakel (bit-genau) plus die JavaParser-Struktur-Invarianten
  # aus. Logik liegt vollständig deklarativ in `runtimes/java/build.gradle.kts`
  # (Tasks `generateFindslJava`, `generatedTest`, `structureTest`, hängt an
  # `check`).
  #
  # Audit-Modus (ADR2, gemäß `runtimes/java/gradle.properties`):
  # `--no-daemon --no-configuration-cache --rerun-tasks` → kein Hintergrund-
  # zustand, jede Phase frisch, jeder Output von Grund auf erzeugt.
  # -------------------------------------------------------------------------
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # JDK 21 (Temurin) ist Pflicht (ADR9). `cache: gradle` cached
      # ~/.gradle/caches und ~/.gradle/wrapper — Re-Runs sind wesentlich
      # schneller, ohne dass das CI-Ergebnis vom Cache abhängt
      # (--rerun-tasks erzwingt echte Re-Execution).
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      # Nur `build` (TypeScript-Compile) — das Gradle-Gate braucht die
      # CLI unter `packages/cli/out/main.js`. Bundle/Vitest gehört in
      # den `build`-Job, hier nicht nochmal.
      - name: Build (CLI für Gradle-Codegen)
        run: npm run build

      - name: Gradle check (Codegen-Gate)
        working-directory: runtimes/java
        run: ./gradlew check --no-daemon --no-configuration-cache --rerun-tasks --console=plain --stacktrace

      # Test-Reports bei Failure hochladen — JUnit-XML + HTML der drei
      # Test-Tasks (test / generatedTest / structureTest). Hilft, einen
      # roten CI-Lauf ohne lokale JDK-Installation zu diagnostizieren.
      - name: Upload Gradle test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-test-reports
          path: |
            runtimes/java/build/reports/tests/
            runtimes/java/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
