# ---------------------------------------------------------------------------
# Release — Lockstep-Veröffentlichung aller FinDSL-Artefakte
#
# Ein Tag = eine Version = sechs Spuren parallel:
#   • @findsl/core, @findsl/cli, @findsl/lsp, @findsl/web,
#     @findsl/editor, @findsl/editor-react           → npm (Sigstore-Provenance)
#   • findsl-<version>.vsix                          → VS Code Marketplace + Open VSX
#   • findsl-<version>-<plattform>.{tar.gz,zip}      → GitHub Release (Node-SEA-Binary)
#
# Die Java-Runtime wird **nicht** als Maven-Artefakt veröffentlicht — das CLI
# emittiert die Runtime-Quellen bei jedem `findsl codegen --lang java` ins
# Ausgabeverzeichnis. Generat-Output ist damit ein autonomes Java-Projekt
# ohne externe Dependency.
#
# **Trigger:** Push eines Tags `v*` (z. B. `git tag v1.2.0 && git push origin v1.2.0`).
# Vor dem Tag MUSS `scripts/sync-version.mjs --set X.Y.Z` gelaufen und committet
# sein — der `prepare`-Job exit-1t sonst (Tag-Version ≠ VERSION-Datei).
#
# **Dry-Run:** `workflow_dispatch` mit `dry_run: true` — baut alles, lädt
# Artefakte als Workflow-Artefakte hoch, aber **keine** externe Veröffentlichung.
# Nutzt **keine** Secrets — ideal um Build-Pfade ohne Konten zu prüfen.
#
# **Benötigte Repo-Secrets** (Settings → Secrets → Actions):
#   NPM_TOKEN                    npm Publish-Token (Automation, scope: @findsl)
#   VSCE_PAT                     Azure-DevOps-PAT für VS Marketplace
#   OVSX_PAT                     Open-VSX-Token
#   GPG_PRIVATE_KEY              ASCII-armored GPG-Privater-Key (Linux-Sig + SHA256SUMS)
#   GPG_PASSPHRASE               Passphrase des Keys
#
# **Signaturen:** npm via Sigstore (OIDC, kostenfrei). Linux-Tar per detached
# GPG-Signatur. Aggregiertes SHA256SUMS GPG-signiert. **macOS- und Windows-
# Binaries werden bewusst NICHT signiert** (Entscheidung: keine
# kostenpflichtigen Zertifikate; #245, ADR apps/intellij/docs/binary-signing.md).
# Integrität via SHA256SUMS/GPG + (Plugin) SHA-256-Pinning gegen checksums.json.
# Nutzer-Doku zur Gatekeeper/SmartScreen-Umgehung: `docs/install.md`.
#
# **Sicherheit:** sämtliche Werte aus `${{ … }}` (inputs, needs, matrix) werden
# über `env:` in Shell-Variablen exportiert und nirgends direkt in `run:`-
# Skripte interpoliert (Workflow-Injection-Härtung).
#
# Actions sind per Commit-SHA gepinnt (Renovate hält das aktuell).
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run (bauen, aber NICHT veröffentlichen)'
        required: false
        default: true
        type: boolean
      version:
        description: 'Dry-Run-Version (z. B. 0.1.0); ignoriert bei Tag-Trigger'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # GH-Release erzeugen + Assets hochladen
  id-token: write   # npm Sigstore-Provenance via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # -------------------------------------------------------------------------
  # `prepare` — Tag → Version + Validierung
  #
  # Garantiert Lockstep: die Version aus dem Tag (`v1.2.3` → `1.2.3`) muss
  # exakt mit der committeten `VERSION`-Datei + allen `package.json` über-
  # einstimmen. Ist sie das nicht, exit mit Fehler — kein Artefakt wird gebaut.
  # -------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version + dry-run
        id: v
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            DRY="false"
          else
            VERSION="${DISPATCH_VERSION:-$(cat VERSION)}"
            DRY="${DISPATCH_DRY_RUN:-true}"
          fi
          FILE_VERSION="$(cat VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag-Version ($VERSION) != VERSION-Datei ($FILE_VERSION)."
            echo "::error::Erst 'node scripts/sync-version.mjs --set <ver>' laufen lassen, committen, dann taggen."
            exit 1
          fi
          # Pre-Release == SemVer mit Bindestrich (z. B. 1.0.0-rc.1). Steuert
          # npm-dist-tag (`next` statt `latest`) und das Überspringen des
          # VS-Code-Marketplace (akzeptiert keine SemVer-Pre-Releases).
          if [[ "$VERSION" == *-* ]]; then PRE="true"; else PRE="false"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "::notice::Release-Version: $VERSION (dry-run: $DRY, prerelease: $PRE)"

      - name: Install dependencies
        run: npm ci

      - name: Verify Lockstep (alle Versionen synchron)
        run: npm run version:check

  # -------------------------------------------------------------------------
  # `npm` — @findsl/core, @findsl/cli, @findsl/lsp
  #
  # Veröffentlicht mit Sigstore-Provenance (OIDC). Reihenfolge: core zuerst,
  # dann cli + lsp (beide hängen an core).
  #
  # Pre-Releases (Version mit Bindestrich) landen unter dem dist-tag `next`
  # statt `latest` — sonst würde `npm install @findsl/cli` die Vorabversion
  # ziehen (npm setzt sonst IMMER `latest`, auch bei `-rc.1`).
  # -------------------------------------------------------------------------
  npm:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build (langium:generate + tsc + assets + Browser-Bundle + Editor)
        run: |
          npm run langium:generate
          npm run build
          npm run -w @findsl/web build:web
          # @findsl/editor baut NACH @findsl/web (braucht dessen dist-Typen).
          npm run -w @findsl/editor build:editor
          # @findsl/editor-react baut NACH @findsl/editor (braucht dessen dist-Typen).
          npm run -w @findsl/editor-react build:editor-react

      - name: Publish @findsl/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_FLAG=""
          [ "$PRERELEASE" = "true" ] && TAG_FLAG="--tag next"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish -w @findsl/core --dry-run --access public $TAG_FLAG
          elif npm view "@findsl/core@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@findsl/core@$VERSION bereits publiziert — überspringe."
          else
            npm publish -w @findsl/core --provenance --access public $TAG_FLAG
          fi

      - name: Publish @findsl/cli + @findsl/lsp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_FLAG=""
          [ "$PRERELEASE" = "true" ] && TAG_FLAG="--tag next"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish -w @findsl/cli --dry-run --access public $TAG_FLAG
            npm publish -w @findsl/lsp --dry-run --access public $TAG_FLAG
          else
            if npm view "@findsl/cli@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::@findsl/cli@$VERSION bereits publiziert — überspringe."
            else
              npm publish -w @findsl/cli --provenance --access public $TAG_FLAG
            fi
            if npm view "@findsl/lsp@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::@findsl/lsp@$VERSION bereits publiziert — überspringe."
            else
              npm publish -w @findsl/lsp --provenance --access public $TAG_FLAG
            fi
          fi

      - name: Publish @findsl/web (Browser-Bundle)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_FLAG=""
          [ "$PRERELEASE" = "true" ] && TAG_FLAG="--tag next"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish -w @findsl/web --dry-run --access public $TAG_FLAG
          elif npm view "@findsl/web@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@findsl/web@$VERSION bereits publiziert — überspringe."
          else
            npm publish -w @findsl/web --provenance --access public $TAG_FLAG
          fi

      - name: Publish @findsl/editor (einbettbarer Monaco-Editor)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_FLAG=""
          [ "$PRERELEASE" = "true" ] && TAG_FLAG="--tag next"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish -w @findsl/editor --dry-run --access public $TAG_FLAG
          elif npm view "@findsl/editor@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@findsl/editor@$VERSION bereits publiziert — überspringe."
          else
            npm publish -w @findsl/editor --provenance --access public $TAG_FLAG
          fi

      - name: Publish @findsl/editor-react (React-Komponente)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_FLAG=""
          [ "$PRERELEASE" = "true" ] && TAG_FLAG="--tag next"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish -w @findsl/editor-react --dry-run --access public $TAG_FLAG
          elif npm view "@findsl/editor-react@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@findsl/editor-react@$VERSION bereits publiziert — überspringe."
          else
            npm publish -w @findsl/editor-react --provenance --access public $TAG_FLAG
          fi

  # -------------------------------------------------------------------------
  # `vsix` — VS Code Marketplace + Open VSX
  #
  # Marketplace signiert intern (PAT-Auth genügt). Bei Dry-Run wird das
  # `.vsix` nur gebaut und als Workflow-Artefakt hochgeladen.
  #
  # Pre-Releases (Version mit Bindestrich) überspringen Marketplace + Open VSX:
  # beide akzeptieren NUR `major.minor.patch` (keine SemVer-Pre-Releases wie
  # `1.0.0-rc.1`). Das `.vsix` wird trotzdem gebaut und hängt über die
  # `release`-Spur am GitHub-Release — Tester laden es dort herunter.
  # -------------------------------------------------------------------------
  vsix:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run all` = langium:generate + build + bundle + npm test. `tsc -b`
      # (build) erfasst @findsl/editor + @findsl/editor-react NICHT — beide sind
      # tsc-only und nicht Teil der tsconfig-references. Ohne ihre dist scheitert
      # der editor-react-Test in `npm test` am Bare-Import `@findsl/editor`
      # (exports → ./dist/index.js fehlt). Daher hier statt `npm run all` die
      # expandierte Kette mit editor-Builds VOR Vitest — Reihenfolge wie ci.yml
      # und npm-Job: web → editor → editor-react (dist-Typen-Abhängigkeit).
      - name: Build extension (langium:generate + build + bundle + editor + Vitest)
        run: |
          npm run langium:generate
          npm run build
          npm run bundle
          npm run -w @findsl/web build:web
          npm run -w @findsl/editor build:editor
          npm run -w @findsl/editor-react build:editor-react
          npm test

      - name: Package .vsix
        working-directory: apps/vscode
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce package --no-dependencies --out "../../findsl-${VERSION}.vsix"

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: findsl-${{ needs.prepare.outputs.version }}.vsix
          retention-days: 14

      - name: Pre-Release — Marketplace/Open VSX übersprungen
        if: needs.prepare.outputs.prerelease == 'true'
        run: |
          echo "::notice::Pre-Release ($VERSION) — VS Marketplace + Open VSX uebersprungen (akzeptieren keine SemVer-Pre-Releases). Das .vsix haengt am GitHub-Release."

      - name: Publish to VS Code Marketplace
        if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.prerelease == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: apps/vscode
        run: |
          set -euo pipefail
          # Graceful skip wenn das Secret fehlt — analog website-dispatch. Sonst
          # bräche ein leeres VSCE_PAT den Job hart ab (TF400813) und der
          # Open-VSX-Schritt DANACH käme nie dran. Das .vsix hängt ohnehin am
          # GitHub-Release; der Marketplace-Publish ist nachrangig nachholbar.
          # (secrets.* ist in step-`if` nicht zuverlässig → Prüfung hier.)
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT nicht gesetzt — VS-Code-Marketplace-Publish uebersprungen. .vsix haengt am GitHub-Release, Open VSX wird separat publiziert."
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --packagePath "../../findsl-${VERSION}.vsix"

      - name: Publish to Open VSX
        if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.prerelease == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          # Graceful skip wenn das Secret fehlt (unabhängig vom Marketplace-Schritt).
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT nicht gesetzt — Open-VSX-Publish uebersprungen. Das .vsix haengt am GitHub-Release."
            exit 0
          fi
          npx --yes ovsx publish "findsl-${VERSION}.vsix" -p "$OVSX_PAT"

  # -------------------------------------------------------------------------
  # `binaries` — Node-SEA pro Host-Plattform
  #
  # Matrix: macOS-Intel, macOS-Apple-Silicon, Linux-x64, Windows-x64. Node
  # SEA cross-kompiliert NICHT — jedes Binary entsteht auf seinem nativen
  # Runner. Anschließend werden Tar/Zip + SHA256 erzeugt; Linux-Tar
  # zusätzlich GPG-signiert (detached). macOS/Windows bleiben UNSIGNIERT
  # (Entscheidung: keine kostenpflichtigen Zertifikate, Doku in install.md).
  # -------------------------------------------------------------------------
  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            archive: tar.gz
          - os: ubuntu-22.04
            target: linux-x64
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + Bundle + Binaries (CLI + LSP)
        run: |
          npm run langium:generate
          npm run build
          npm run bundle
          node scripts/build-binary.mjs all

      - name: Pack archive (POSIX)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="findsl-${VERSION}-${TARGET}"
          mkdir -p "$STAGE"
          cp packages/cli/dist/findsl "$STAGE/"
          # AFM-Metriken sind seit #121 ins Binary eingebettet — kein dist/data mehr.
          if [ -f README.md ]; then cp README.md "$STAGE/"; fi
          if [ -f LICENSE-COMMERCIAL.md ]; then cp LICENSE-COMMERCIAL.md "$STAGE/"; fi
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

      - name: Pack archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "findsl-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item packages/cli/dist/findsl.exe $stage/
          # AFM-Metriken sind seit #121 ins Binary eingebettet — kein dist/data mehr.
          if (Test-Path README.md) { Copy-Item README.md $stage/ }
          if (Test-Path LICENSE-COMMERCIAL.md) { Copy-Item LICENSE-COMMERCIAL.md $stage/ }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -FilePath "$stage.zip.sha256" -Encoding ascii

      - name: GPG-sign Linux tarball
        if: matrix.target == 'linux-x64' && needs.prepare.outputs.dry_run == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign "findsl-${VERSION}-${TARGET}.tar.gz"

      # Rohe Binaries (ohne Archiv) für den IntelliJ-Lazy-Download (#244, ADR
      # apps/intellij/docs/binary-distribution.md): Asset-Namen mit OS/Arch-Suffix.
      - name: Stage raw binaries — plugin lazy-download (POSIX)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw
          cp packages/lsp/dist/findsl-lsp "raw/findsl-lsp-${TARGET}"
          cp packages/cli/dist/findsl "raw/findsl-${TARGET}"

      - name: Stage raw binaries — plugin lazy-download (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path raw | Out-Null
          Copy-Item packages/lsp/dist/findsl-lsp.exe "raw/findsl-lsp-$env:TARGET.exe"
          Copy-Item packages/cli/dist/findsl.exe "raw/findsl-$env:TARGET.exe"

      - name: Upload artifacts (CLI-Archiv)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            findsl-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*
          retention-days: 14
          if-no-files-found: error

      - name: Upload artifacts (rohe Binaries für Plugin)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-binary-${{ matrix.target }}
          path: raw/*
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # `binary-intel-mac` — Intel-macOS (darwin-x64), BEST-EFFORT
  #
  # GitHub-hosted `macos-13`-Runner (Intel) sind für dieses Repo faktisch
  # nicht verfügbar (queuen endlos), während `macos-14`/arm64 zuverlässig
  # läuft. Daher als EIGENER, NICHT blockierender Job: der `release`-Job
  # hat ihn NICHT in `needs`. Bekommt ein Intel-Runner einen Slot, lädt er
  # das Binary als Artefakt hoch und `release` nimmt es mit; sonst wird das
  # Release davon NICHT aufgehalten (`continue-on-error`). Kein Secret-
  # Schritt (GPG-Signatur nur für Linux). Wieder in die `binaries`-Matrix
  # ziehen, sobald Intel-Runner verlässlich verfügbar sind.
  # -------------------------------------------------------------------------
  binary-intel-mac:
    needs: prepare
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + Bundle + Binaries (CLI + LSP)
        run: |
          npm run langium:generate
          npm run build
          npm run bundle
          node scripts/build-binary.mjs all

      - name: Pack archive (POSIX)
        shell: bash
        run: |
          set -euo pipefail
          STAGE="findsl-${VERSION}-${TARGET}"
          mkdir -p "$STAGE"
          cp packages/cli/dist/findsl "$STAGE/"
          # AFM-Metriken sind seit #121 ins Binary eingebettet — kein dist/data mehr.
          if [ -f README.md ]; then cp README.md "$STAGE/"; fi
          if [ -f LICENSE-COMMERCIAL.md ]; then cp LICENSE-COMMERCIAL.md "$STAGE/"; fi
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

      - name: Stage raw binaries — plugin lazy-download (#244)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw
          cp packages/lsp/dist/findsl-lsp "raw/findsl-lsp-${TARGET}"
          cp packages/cli/dist/findsl "raw/findsl-${TARGET}"

      - name: Upload artifacts (CLI-Archiv)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-darwin-x64
          path: |
            findsl-${{ needs.prepare.outputs.version }}-darwin-x64.*
          retention-days: 14
          if-no-files-found: error

      - name: Upload artifacts (rohe Binaries für Plugin)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-binary-darwin-x64
          path: raw/*
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # `intellij` — IntelliJ-Plugin bauen (+ gated sign/publish), #244
  #
  # Lädt die rohen Plattform-Binaries (raw-binary-*), generiert daraus das
  # eingebettete checksums.json (Lazy-Download-Manifest, ADR #243) und baut das
  # Plugin. In CI liegen KEINE Binaries in packages/{lsp,cli}/dist/ → embed-Tasks
  # greifen nicht → das Release-Plugin ist schlank (nur Manifest), wie gewollt.
  # `signPlugin`/`publishPlugin` laufen nur, wenn die jeweiligen Secrets gesetzt
  # sind (Zertifikat = #245, Marketplace-Token/-Account = Nutzer-Setup); sonst
  # graceful skip. Wartet auf binary-intel-mac (continue-on-error → blockiert
  # nicht), damit das Manifest deterministisch auch darwin-x64 enthält.
  # -------------------------------------------------------------------------
  intellij:
    needs: [prepare, binaries, binary-intel-mac]
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Download raw binaries (alle Plattformen)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raw-binary-*
          path: raw-binaries
          merge-multiple: true

      - name: Checksums-Manifest erzeugen (Lazy-Download, ADR #243)
        run: |
          set -euo pipefail
          node scripts/gen-binary-checksums.mjs \
            raw-binaries "$VERSION" \
            apps/intellij/src/main/resources/binaries/checksums.json
          echo "::group::checksums.json"
          cat apps/intellij/src/main/resources/binaries/checksums.json
          echo "::endgroup::"

      - name: Build plugin
        working-directory: apps/intellij
        run: ./gradlew buildPlugin --no-daemon --console=plain --stacktrace

      - name: Sign plugin (nur mit Zertifikat-Secret, #245)
        if: needs.prepare.outputs.dry_run == 'false'
        working-directory: apps/intellij
        env:
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # secrets.* in step-`if` unzuverlässig → Gate im Skript (Muster wie GPG/website-dispatch).
          if [ -z "${JETBRAINS_CERTIFICATE_CHAIN:-}" ]; then
            echo "::warning::JETBRAINS_CERTIFICATE_CHAIN nicht gesetzt — signPlugin übersprungen (Zertifikat = #245)."
            exit 0
          fi
          ./gradlew signPlugin --no-daemon --console=plain --stacktrace

      - name: Publish plugin (nur mit Marketplace-Token, kein Pre-Release)
        if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.prerelease == 'false'
        working-directory: apps/intellij
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${JETBRAINS_PUBLISH_TOKEN:-}" ]; then
            echo "::warning::JETBRAINS_PUBLISH_TOKEN nicht gesetzt — publishPlugin übersprungen (Marketplace-Account/-Token nötig)."
            exit 0
          fi
          # Nicht-blockierend: Die ERSTE Marketplace-Veröffentlichung MUSS laut
          # JetBrains manuell erfolgen (plugins.jetbrains.com → „Add new plugin",
          # Plugin-.zip aus dem GH-Release bzw. dem `intellij-plugin`-Artefakt) —
          # `publishPlugin` (API/Token) greift erst ab der zweiten Version. Ein
          # Fehlschlag (erste Version noch nicht manuell hochgeladen, Review
          # ausstehend, transienter Marketplace-Fehler) darf das Release NICHT
          # kippen — das Plugin-.zip hängt ohnehin am GH-Release.
          if ! ./gradlew publishPlugin --no-daemon --console=plain --stacktrace; then
            echo "::warning::publishPlugin fehlgeschlagen — nicht blockierend. Erste Veröffentlichung manuell nötig (plugins.jetbrains.com), danach greift es automatisch. Sonst Token/Review prüfen."
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-plugin
          path: |
            apps/intellij/build/distributions/*.zip
            apps/intellij/src/main/resources/binaries/checksums.json
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # `release` — GitHub Release mit allen Artefakten
  #
  # Sammelt vsix + alle Binaries, generiert eine aggregierte SHA256SUMS-
  # Datei (GPG-signiert) und legt das GitHub Release an. Bei Dry-Run wird
  # nur eine Zusammenfassung geloggt — kein Release erzeugt.
  #
  # Issue #175: vsix bleibt in `needs` (sonst Race — release liefe parallel,
  # bevor das .vsix-Artefakt hochgeladen ist), aber sein Erfolg ist NICHT im
  # `if`-Gate. `always()` lässt den Job auf alle needs WARTEN statt beim
  # ersten Fehlschlag zu skippen; Pflicht-Spuren sind nur npm + binaries. Ein
  # vsix-Fehlschlag erzeugt damit ein Release OHNE .vsix statt GAR KEIN
  # Release — der Stage-Schritt sammelt vorhandene Artefakte tolerant ein.
  # -------------------------------------------------------------------------
  release:
    needs: [prepare, npm, vsix, binaries, intellij]
    # `intellij` bewusst NICHT im `if` — ein Plugin-Fehlschlag darf das Release
    # (npm + Binaries) nicht kippen (tolerant, analog vsix). Die Plugin-Artefakte
    # werden mitgenommen, falls vorhanden.
    if: always() && needs.npm.result == 'success' && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.gz.asc' \
            -o -name '*.zip' -o -name '*.vsix' \) -exec cp {} release/ \;
          # Rohe Plattform-Binaries für den IntelliJ-Lazy-Download (#244, ADR
          # apps/intellij/docs/binary-distribution.md): findsl-lsp-<os>-<arch> +
          # findsl-<os>-<arch> (kein Archiv). Liegen unter artifacts/raw-binary-*/.
          find artifacts/raw-binary-* -type f -exec cp {} release/ \; 2>/dev/null || true
          # Checksums-Manifest mit ins Release (Transparenz + manuelle Verifikation).
          if [ -f artifacts/intellij-plugin/checksums.json ]; then
            cp artifacts/intellij-plugin/checksums.json "release/findsl-binaries-checksums-v${VERSION}.json"
          fi
          # Agent Skills (skills/findsl-author …) als eigenes Release-Asset
          # mitliefern — Endnutzer installieren es in ihren Agenten (Claude
          # Code / OpenCode / Codex). Landet via *.zip-Glob in SHA256SUMS.
          if [ -d skills ]; then
            ( cd skills && zip -qr "../release/findsl-skills-v${VERSION}.zip" . )
          fi
          cd release
          # SHA256SUMS über ALLE Release-Assets (inkl. rohe Binaries + Plugin-zip),
          # außer der Summen-Datei selbst.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
            | sort | xargs shasum -a 256 > SHA256SUMS
          ls -la

      - name: GPG-sign SHA256SUMS
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign release/SHA256SUMS

      - name: Create GitHub Release
        if: needs.prepare.outputs.dry_run == 'false'
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af # v1.18.0
        with:
          tag: v${{ needs.prepare.outputs.version }}
          name: FinDSL v${{ needs.prepare.outputs.version }}
          artifacts: 'release/*'
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}

      - name: Dry-Run summary
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          echo "::notice::Dry-Run abgeschlossen — folgende Artefakte waeren veroeffentlicht worden:"
          ls -la release/

  # -------------------------------------------------------------------------
  # `website-dispatch` — SPEC-Sync-Signal an findsl/website (Issue #125 + #175)
  #
  # Eigenständiger Job mit `needs: [prepare]` — der Dispatch braucht NUR Tag +
  # Version. findsl/website holt `SPEC.md` selbst am Git-Tag (existiert bereits
  # beim Push = Trigger), byte-genau/versionsgestempelt. Daher KEINE Kopplung
  # an npm/vsix/binaries/release: ein VSIX- oder Binary-Fehlschlag darf den
  # SPEC-Sync NICHT verhindern (war die schwerwiegendere Folge in Issue #175,
  # als der Dispatch noch im release-Job hing und mit dem vsix-Fehler entfiel).
  # Bei JEDEM Release inkl. pre-release/rc (kein prerelease-Gate).
  # -------------------------------------------------------------------------
  website-dispatch:
    needs: prepare
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Website über neue SPEC informieren (repository_dispatch)
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # Graceful skip, solange das Secret (noch) nicht gesetzt ist: das
          # Token + der Website-Empfänger sind separate Schritte; der Dispatch
          # darf daran NICHT scheitern. Sobald WEBSITE_DISPATCH_TOKEN existiert
          # (fine-grained PAT, Contents:write auf findsl/website), greift es
          # automatisch. (secrets.* ist in step-`if` nicht zuverlässig nutzbar
          # → Prüfung hier im Skript.)
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN nicht gesetzt — SPEC-Sync zu findsl/website übersprungen (Issue #125)."
            exit 0
          fi
          # Best-effort: ein fehlgeschlagener Dispatch (Token ohne Zugriff aufs
          # private findsl/website → 404, falsche Permission → 403, o. Ä.) darf
          # den Job NICHT kippen — die SPEC-Benachrichtigung ist nachrangig.
          if gh api repos/findsl/website/dispatches \
            -f event_type=spec-updated \
            -F "client_payload[version]=$VERSION" \
            -F "client_payload[tag]=v$VERSION"; then
            echo "::notice::repository_dispatch 'spec-updated' an findsl/website (v$VERSION) gesendet."
          else
            echo "::warning::repository_dispatch an findsl/website fehlgeschlagen (Token-Zugriff/Repo prüfen) — nicht blockierend (Issue #125)."
          fi
