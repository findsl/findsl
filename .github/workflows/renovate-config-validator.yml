# ---------------------------------------------------------------------------
# Renovate-Config-Validator (FinDSL)
#
# Warum: Eine syntaktisch kaputte renovate.json deaktiviert Dependency-
# Updates still — das soll zur PR-Zeit auffallen, nicht erst beim nächsten
# geplanten Renovate-Lauf.
#
# Tool: Renovates eigener `renovate-config-validator` (Teil des renovate-
# npm-Pakets) via npx, `--strict` (Warnungen = Fehler). Dieselbe Binary,
# die produktiv läuft, prüft hier das Schema.
#
# Security: Kein Event-Payload fließt in einen `run:`-Step — nur statische
# Literale; die Workflow-Injection-Klasse ist damit nicht anwendbar.
# Actions SHA-gepinnt (wie ci.yml/cla.yml).
# ---------------------------------------------------------------------------
name: Renovate config validator

on:
  push:
    branches: [main]
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate-config-validator.yml"
  pull_request:
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate-config-validator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate .github/renovate.json
        run: npx --yes --package renovate -- renovate-config-validator --strict .github/renovate.json
