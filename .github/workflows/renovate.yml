# ---------------------------------------------------------------------------
# Self-hosted Renovate (FinDSL)
#
# KEINE Mend.io-App, kein gehosteter Dienst: Renovate läuft hier als
# `renovatebot/github-action` auf GitHub-Actions-Runnern, getriggert per
# Cron + manuell. Authentifizierung über ein Repo-scoped PAT-Secret
# `RENOVATE_TOKEN` (Fallback `GITHUB_TOKEN`, solange das Secret fehlt) —
# self-hosted, kein Mend, keine GitHub-App, kein org-übergreifender Zugriff.
#
# Bei plugwerk ist diese Logik auf ein org-weites Reusable-Workflow
# (plugwerk/.github) + einen per-Repo-Stub aufgeteilt. findsl ist ein
# Single-Repo OHNE Org-`.github`-Repo → Stub + Reusable sind hier bewusst
# in EINER self-contained Datei konsolidiert.
#
# Cron 04:00 UTC Mo–Fr ist das EINZIGE Timing-Gate. `.github/renovate.json`
# hat bewusst KEINEN `schedule`-Filter mehr: das frühere enge Fenster
# (`before 6am`, Europe/Berlin) kollidierte mit der Sommerzeit (04:00 UTC =
# 06:00 Berlin, knapp außerhalb) UND der GHA-Cron-Verzögerung (Läufe oft
# Stunden später) → Renovate war beim Lauf stets außerhalb seines Fensters
# und schob alle Updates dauerhaft in „Awaiting Schedule", statt PRs zu
# öffnen. Ohne Config-`schedule` handelt Renovate bei JEDEM Lauf.
# `workflow_dispatch` erlaubt On-Demand-Läufe (Actions-Tab oder
# `gh workflow run renovate.yml`); RENOVATE_FORCE setzt dort zusätzlich
# `recreateWhen:always`, sodass auch geschlossene/limitierte Updates neu öffnen.
#
# HINWEIS: Renovate nutzt das PAT-Secret `RENOVATE_TOKEN`. Mit einem PAT
# erstellte PRs lösen — anders als mit `GITHUB_TOKEN` — Folge-Workflows
# aus, sodass die main-Ruleset-Pflicht-Checks `build` + `cla-check`
# automatisch laufen. Fehlt das Secret, fällt der Workflow auf
# `GITHUB_TOKEN` zurück; dann müssen die Checks pro Renovate-PR manuell
# angestoßen werden (leerer Commit / close+reopen). `cla-check` greift
# dank Allowlist-Eintrag `*[bot]` automatisch grün. PAT-Scope: classic
# `repo` + `workflow` (workflow nötig, da Renovate Actions-SHA-Pins in
# .github/workflows/* aktualisiert), oder fine-grained mit Contents/
# Pull requests/Workflows/Issues = RW, Metadata = RO. Actions-SHA-Pins
# pflegt Renovate selbst (Gruppe „GitHub Actions").
# ---------------------------------------------------------------------------
name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        type: choice
        default: "info"
        options:
          - info
          - debug

permissions:
  contents: write       # Branch + Push
  pull-requests: write  # PRs öffnen + labeln
  issues: write         # Dependency-Dashboard-Issue aktualisieren

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Concurrency je Repo/Ref: zwei parallele Renovate-Läufe dürfen sich
    # nicht bei der Branch-Erstellung in die Quere kommen.
    concurrency:
      group: renovate-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    # Workflow-Input in eine env-Var heben, damit der run-Step keinen
    # Workflow-Input direkt in ein Shell-Feld interpoliert (Injection-
    # Härtung), obwohl der Input (choice) ohnehin formbeschränkt ist.
    env:
      RENOVATE_LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Renovate
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          configurationFile: .github/renovate.json
          # RENOVATE_TOKEN = Repo-scoped PAT (Secret, vom Maintainer
          # angelegt). PAT-erstellte PRs triggern — anders als
          # GITHUB_TOKEN — Folge-Workflows, also die Pflicht-Checks
          # build/cla-check. Fallback auf GITHUB_TOKEN, solange das
          # Secret fehlt → Renovate läuft weiter (PRs dann ungeprüft,
          # bis das Secret gesetzt ist).
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ env.RENOVATE_LOG_LEVEL }}
          # renovatebot/github-action v46 leitet das Ziel-Repo nicht mehr
          # aus dem Runtime-Kontext ab — ohne explizites
          # RENOVATE_REPOSITORIES läuft der Job erfolgreich durch, loggt
          # aber `WARN: No repositories found` und tut nichts.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Manuelle Läufe (workflow_dispatch) setzen `recreateWhen:always`
          # — so legt Renovate auch zuvor MANUELL geschlossene PRs (z. B.
          # Pin-/npm-Gruppe) gezielt wieder an. `schedule:null` ist seit dem
          # Entfernen des Config-`schedule` ein No-op, bleibt aber defensiv
          # gesetzt (falls je wieder ein Schedule eingeführt wird). Cron-
          # Läufe nutzen den Default `recreateWhen:auto`; für Nicht-Dispatch-
          # Trigger ist der Ausdruck `{}` (No-op), env immer gesetzt/parsebar.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":null,"recreateWhen":"always"}' || '{}' }}
