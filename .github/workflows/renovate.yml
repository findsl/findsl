# ---------------------------------------------------------------------------
# Self-hosted Renovate (FinDSL)
#
# KEINE Mend.io-App, kein gehosteter Dienst: Renovate läuft hier als
# `renovatebot/github-action` auf GitHub-Actions-Runnern, getriggert per
# Cron + manuell. Authentifizierung NUR über das eingebaute `GITHUB_TOKEN`
# — kein PAT, keine GitHub-App, kein org-übergreifender Zugriff.
#
# Bei plugwerk ist diese Logik auf ein org-weites Reusable-Workflow
# (plugwerk/.github) + einen per-Repo-Stub aufgeteilt. findsl ist ein
# Single-Repo OHNE Org-`.github`-Repo → Stub + Reusable sind hier bewusst
# in EINER self-contained Datei konsolidiert.
#
# Cron 04:00 UTC Mo–Fr spiegelt den Config-Filter
# `before 6am every weekday` (Europe/Berlin) aus `.github/renovate.json`.
# `workflow_dispatch` erlaubt On-Demand-Läufe (Actions-Tab oder
# `gh workflow run renovate.yml`); dann wird der schedule-Filter via
# RENOVATE_FORCE übersteuert, sodass PRs sofort geöffnet werden.
#
# HINWEIS: Mit `GITHUB_TOKEN` erstellte PRs lösen KEINE Folge-Workflows
# aus (GitHub-Schutz gegen Workflow-Rekursion). Da das main-Ruleset
# `build` + `cla-check` als Pflicht-Checks verlangt, müssen diese auf
# Renovate-PRs angestoßen werden (PR schließen+wieder öffnen oder
# Maintainer-„Re-run"). `cla-check` selbst greift dank Allowlist-Eintrag
# `*[bot]` automatisch grün. Actions-SHA-Pins werden von Renovate selbst
# gepflegt (Gruppe „GitHub Actions").
# ---------------------------------------------------------------------------
name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        type: choice
        default: "info"
        options:
          - info
          - debug

permissions:
  contents: write       # Branch + Push
  pull-requests: write  # PRs öffnen + labeln
  issues: write         # Dependency-Dashboard-Issue aktualisieren

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Concurrency je Repo/Ref: zwei parallele Renovate-Läufe dürfen sich
    # nicht bei der Branch-Erstellung in die Quere kommen.
    concurrency:
      group: renovate-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    # Workflow-Input in eine env-Var heben, damit der run-Step keinen
    # Workflow-Input direkt in ein Shell-Feld interpoliert (Injection-
    # Härtung), obwohl der Input (choice) ohnehin formbeschränkt ist.
    env:
      RENOVATE_LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Renovate
        uses: renovatebot/github-action@79dc0ba74dc3de28db0a7aeb1d0b95d5bf5fde2a # v46.1.13
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ env.RENOVATE_LOG_LEVEL }}
          # renovatebot/github-action v46 leitet das Ziel-Repo nicht mehr
          # aus dem Runtime-Kontext ab — ohne explizites
          # RENOVATE_REPOSITORIES läuft der Job erfolgreich durch, loggt
          # aber `WARN: No repositories found` und tut nichts.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Manuelle Läufe (workflow_dispatch) übersteuern den
          # per-Config-`schedule`, damit PRs sofort entstehen. Cron-Läufe
          # lassen den `before 6am every weekday`-Filter intakt. Für
          # Nicht-Dispatch-Trigger löst der Ausdruck zu `{}` auf (No-op),
          # die env-Var bleibt immer gesetzt und parsebar.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":null}' || '{}' }}
