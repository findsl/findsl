# --- Plugin-Koordinaten ---
pluginGroup = de.devtank42.findsl
pluginName = findsl-intellij
# Eigenständige Pre-Release-Version; die Kopplung an die Monorepo-Version
# (scripts/sync-version.mjs) folgt mit dem Release-Setup (#244).
pluginVersion = 0.1.0

# Plattform-Kompatibilität: LSP4IJ-Floor = IntelliJ 2024.2 (Build 242).
# untilBuild bewusst offen (siehe build.gradle.kts) — wie LSP4IJ selbst.
pluginSinceBuild = 242

# --- Ziel-IDE zum Bauen: Community = kleinster gemeinsamer Nenner ---
# (das resultierende Plugin läuft auch in Ultimate/WebStorm/PyCharm etc.)
platformType = IC
platformVersion = 2024.2

# --- LSP4IJ (Red Hat) als Marketplace-Plugin-Abhängigkeit ---
lsp4ijVersion = 0.19.4

# --- Gradle ---
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
