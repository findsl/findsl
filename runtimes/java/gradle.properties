# Reproduzierbarer, audit-stabiler Build (ADR2/ADR9):
# - Daemon aus  → kein Hintergrundzustand zwischen Läufen
# - console=plain → deterministische, diff-bare Ausgabe
# - auto-download der JDK-Toolchain aus → nutzt die installierte JDK 21,
#   lädt nichts still nach (schlägt sonst klar fehl)
org.gradle.daemon=false
org.gradle.console=plain
org.gradle.java.installations.auto-download=false
