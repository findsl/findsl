# Reproduzierbarer, audit-stabiler Build (ADR2/ADR9).
#
# Schichtenmodell:
#   • Lokal (Entwickler-Alltag): Daemon + Configuration-Cache AN → warmer
#     `./gradlew`-Aufruf < 2 s, kalt ~10 s. Daemon/Cache beeinflussen
#     KEINE Build-Outputs (Reproduzierbarkeit = Output-Eigenschaft), nur
#     die Lebensdauer der JVM und das Wiederverwenden der bereits einmal
#     ausgewerteten Konfigurationsphase.
#   • CI/Release (hermetisch, ADR2-Audit): genau so aufrufen
#       ./gradlew check --no-daemon --no-configuration-cache --rerun-tasks
#     → kein Hintergrundzustand, jede Phase frisch, jeder Output von
#     Grund auf erzeugt. Damit bleibt ADR2 wortgetreu für die Audit-Stufe
#     erhalten, ohne den Entwickler-Workflow zu lähmen.
#
# Toolchain: JDK 21 muss installiert sein; `auto-download=false` lädt
# nichts still nach (schlägt sonst klar fehl, ADR9).

org.gradle.daemon=true
org.gradle.configuration-cache=true
# Configuration-Cache-Probleme NICHT verschweigen, aber den Build auch
# nicht beim ersten Migrations-Problem brechen — sichtbar warnen.
org.gradle.configuration-cache.problems=warn
org.gradle.console=plain
org.gradle.java.installations.auto-download=false
